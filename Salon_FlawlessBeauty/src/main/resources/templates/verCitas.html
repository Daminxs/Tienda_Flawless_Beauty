<!DOCTYPE html>
<!--
    Encargado para Damian: verCitas.html
-->
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}"></head>

<body>

<header th:replace="~{general/fragmentos :: header}"></header>

<div class="container mt-5">

    <h3>Mis Citas</h3>

    <table class="table table-bordered table-hover">

        <thead>
        <tr>
            <th>Código</th>
            <th>Cliente</th>
            <th>Servicio</th>
            <th>Precio</th>
            <th>Fecha</th>
            <th>Hora</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="c : ${citas}">
            <td th:text="${c.codigo}"></td>
            <td th:text="${c.usuario.nombre}"></td>
            <td th:text="${c.servicio.nombre}"></td>

            <td th:text="${c.servicio.precio}"></td>

            <td th:text="${c.fecha}"></td>
            <td th:text="${c.hora}"></td>

            <td>

                <!-- EDITAR -->
                <form th:action="@{/editarCita}" method="post" class="d-inline">

                    <input type="hidden" name="id" th:value="${c.id}">

                    <input type="date" name="fecha" class="form-control mb-1" required>
                    <input type="time" name="hora" class="form-control mb-1" required>

                    <button type="submit" class="btn btn-sm btn-primary">
                        Editar
                    </button>

                </form>

                <!-- CANCELAR -->
                <a th:href="@{/cancelarCita/{id}(id=${c.id})}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Cancelar esta cita?');">
                    Cancelar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<footer th:replace="~{general/fragmentos :: footer}"></footer>

</body>
</html>
