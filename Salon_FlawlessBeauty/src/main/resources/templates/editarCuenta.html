<!DOCTYPE html>
<!--
    Encargado para Damian: editarCuenta.html
-->
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">

            <div class="row justify-content-center">

                <div class="col-md-6">

                    <div class="card shadow p-4">

                        <h2 class="text-center mb-4">Editar Cuenta</h2>

                        <!-- MENSAJES -->
                        <div th:if="${error}" class="alert alert-danger text-center">
                            [[${error}]]
                        </div>

                        <div th:if="${mensaje}" class="alert alert-success text-center">
                            [[${mensaje}]]
                        </div>

                        <form th:action="@{/editarCuenta}" method="post">

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text"
                                       class="form-control"
                                       name="nombre"
                                       th:value="${usuario.nombre}"
                                       required>
                            </div>

                            <!-- Correo (solo lectura) -->
                            <div class="mb-3">
                                <label class="form-label">Correo</label>
                                <input type="email"
                                       class="form-control"
                                       th:value="${usuario.correo}"
                                       readonly>
                            </div>

                            <!-- Teléfono -->
                            <div class="mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text"
                                       class="form-control"
                                       name="telefono"
                                       th:value="${usuario.telefono}">
                            </div>

                            <hr>

                            <h5 class="mb-3 text-center">Cambiar contraseña</h5>
                            
                            <div class="alert alert-info text-center py-2">
                                Deje estos campos vacíos si no desea cambiar la contraseña
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Contraseña actual</label>
                                <input type="password"
                                       name="passwordActual"
                                       class="form-control">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Nueva contraseña</label>
                                <input type="password"
                                       name="nuevaPassword"
                                       class="form-control">
                            </div>

                            <!-- Olvidó contraseña -->
                            <div class="text-end mb-3">
                                <a th:href="@{/recuperar}" style="font-size: 0.9rem;">
                                    ¿Olvidaste tu contraseña?
                                </a>
                            </div>

                            <!-- BOTONES -->
                            <div class="d-grid gap-2">

                                <button type="submit"
                                        class="btn btn-outline-primary">
                                    Guardar cambios
                                </button>

                                <a th:href="@{/perfil}"
                                   class="btn btn-outline-secondary">
                                    Volver al perfil
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
