<!DOCTYPE html>
<!--
    Encargado para Monica: listado (salonpromociones)
-->
<html xmlns:th="http://www.thymeleaf.org">
    
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">
            <div class="text-center mb-5">
                <h1 style="color: #b76e79; font-weight: bold;">¡Descubre lo que tenemos para ti!</h1>
            </div>

            <div class="row justify-content-center">

                <!-- LISTADO -->
                <div class="col-md-5 col-lg-4 mb-4" th:each="promo : ${promociones}">
                    <div class="card border-0 shadow-sm" style="border-radius: 15px;">

                        <!-- Imagen dinámica -->
                        <img th:if="${promo.imagen != null}" 
                             th:src="@{${promo.imagen}}" 
                             class="card-img-top"
                             style="border-radius: 15px; width: 100%; height: auto;" 
                             alt="Promoción">

                        <div class="card-body text-center">
                            <h5 style="color: #b76e79;" th:text="${promo.titulo}">Título</h5>
                            <p class="text-muted small" th:text="${promo.descripcion}">Descripción</p>
                        </div>
                    </div>
                </div>

                <!-- CUANDO NO HAY PROMOS -->
                <div class="col-12 text-center" th:if="${#lists.isEmpty(promociones)}">
                    <p class="text-muted">No hay promociones disponibles por el momento.</p>
                </div>

            </div>
        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
