<!DOCTYPE html>
<!-- Encargado para Jose: modifica.html (salonservicios) -->
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <div class="container mt-5">

            <div class="card shadow p-4">

                <h3 class="mb-4"
                    th:text="${servicio.id == null} ? 'Agregar Servicio' : 'Modificar Servicio'">
                </h3>

                <form th:action="@{/salonservicios/guardar}"
                      th:object="${servicio}"
                      method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{nombre}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{descripcion}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio</label>
                        <input type="number"
                               step="0.01"
                               class="form-control"
                               th:field="*{precio}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría</label>

                        <select class="form-select"
                                th:field="*{categoria}">

                            <option th:each="c : ${categorias}"
                                    th:value="${c.id}"
                                    th:text="${c.nombre}">
                            </option>

                        </select>

                    </div>

                    <div class="d-flex justify-content-between">

                        <a th:href="@{/salonservicios}"
                           class="btn btn-outline-dark">
                            Cancelar
                        </a>

                        <button type="submit"
                                class="btn"
                                style="border:2px solid #b76e79; color:#b76e79;">
                            Guardar
                        </button>

                    </div>

                </form>

            </div>

        </div>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
