<!DOCTYPE html>
<!--
    Encargado para Damian: promociones.html
-->
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">

            <h2 class="text-center mb-4 fw-bold">Gestión de Promociones</h2>

            <div class="card shadow p-4 border-0 rounded-4">

                <div class="mb-3 text-end">
                    <a th:href="@{/admin/promociones/nueva}"
                       class="btn rounded-3 px-4"
                       style="border:2px solid #b76e79; color:#b76e79;">
                        Nueva Promoción
                    </a>
                </div>

                <div class="table-responsive">

                    <table class="table align-middle text-center">

                        <thead style="background:#f3d6cf;">
                            <tr>
                                <th>ID</th>
                                <th>Imagen</th>
                                <th>Título</th>
                                <th>Descuento</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="p : ${promociones}">

                                <td th:text="${p.id}"></td>

                                <td>
                                    <img th:if="${p.imagen != null}"
                                         th:src="@{${p.imagen}}"
                                         width="60" height="60"
                                         class="rounded"
                                         style="object-fit:cover;">
                                </td>

                                <td th:text="${p.titulo}"></td>

                                <td th:text="${p.descuento} + ' %'"></td>

                                <td>
                                    <span th:if="${p.activo}" class="badge bg-success">Activa</span>
                                    <span th:if="${!p.activo}" class="badge bg-danger">Inactiva</span>
                                </td>

                                <td>
                                    <div class="d-flex justify-content-center gap-2">

                                        <!-- VER -->
                                        <button class="btn btn-sm"
                                                style="border:2px solid #b76e79; color:#b76e79;"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="'#modal' + ${p.id}">
                                            Ver
                                        </button>

                                        <!-- EDITAR -->
                                        <a th:href="@{'/admin/editarPromocion/' + ${p.id}}"
                                           class="btn btn-sm"
                                           style="border:2px solid #b76e79; color:#b76e79;">
                                            Editar
                                        </a>

                                        <!-- ELIMINAR -->
                                        <a th:href="@{'/admin/eliminarPromocion/' + ${p.id}}"
                                           class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('¿Eliminar promoción?');">
                                            Eliminar
                                        </a>

                                    </div>
                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(promociones)}">
                                <td colspan="6">No hay promociones registradas</td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

            <div class="text-center mt-4">
                <a th:href="@{/admin}" class="btn btn-outline-dark">
                    Volver al panel
                </a>
            </div>

        </main>

        <!-- MODALES -->
        <div th:each="p : ${promociones}"
             class="modal fade"
             th:id="'modal' + ${p.id}">

            <div class="modal-dialog modal-dialog-centered">

                <div class="modal-content rounded-4">

                    <div class="modal-header">
                        <h5 class="fw-bold" th:text="${p.titulo}"></h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body text-center">

                        <img th:if="${p.imagen != null}"
                             th:src="@{${p.imagen}}"
                             class="img-fluid rounded mb-3"
                             style="max-height:200px; object-fit:cover;">

                        <p class="text-muted" th:text="${p.descripcion}"></p>

                        <hr>

                        <p><strong>Descuento:</strong> <span th:text="${p.descuento}"></span>%</p>

                        <p><strong>Fecha Inicio:</strong> <span th:text="${p.fechaInicio}"></span></p>

                        <p><strong>Fecha Fin:</strong> <span th:text="${p.fechaFin}"></span></p>

                        <p>
                            <strong>Estado:</strong>
                            <span th:if="${p.activo}" class="text-success">Activa</span>
                            <span th:if="${!p.activo}" class="text-danger">Inactiva</span>
                        </p>

                    </div>

                </div>

            </div>

        </div>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
