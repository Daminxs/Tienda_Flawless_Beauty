<!DOCTYPE html>
<!-- Encargado para Damian: Panel Admin - editarProducto.html -->
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">

            <div class="card shadow-lg border-0 rounded-4 p-4">

                <h3 class="mb-4 text-center fw-bold"
                    th:text="${producto.id != null} ? 'Editar Producto' : 'Nuevo Producto'">
                </h3>

                <form th:action="@{/admin/guardarProducto}"
                      th:object="${producto}"
                      method="post"
                      enctype="multipart/form-data">

                    <input type="hidden" th:field="*{id}" />

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control rounded-3" th:field="*{nombre}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Precio (₡)</label>
                            <input type="number" step="0.01" class="form-control rounded-3" th:field="*{precio}">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control rounded-3" th:field="*{descripcion}"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Stock</label>
                            <input type="number" class="form-control rounded-3" th:field="*{stock}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Imagen</label>
                            <input type="file"
                                   class="form-control rounded-3"
                                   name="imagenFile"
                                   accept="image/*">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label">Categoría</label>

                            <select class="form-select rounded-3" th:field="*{categoria}">
                                <option value="">Seleccione</option>
                                <option th:each="c : ${categorias}"
                                        th:value="${c.id}"
                                        th:text="${c.nombre}">
                                </option>
                            </select>

                        </div>

                    </div>

                    <div class="d-flex justify-content-between mt-4">

                        <a th:href="@{/admin/productos}"
                           class="btn btn-outline-dark rounded-3">
                            Volver
                        </a>

                        <button class="btn rounded-3 px-4"
                                style="background:#b76e79; color:white;">
                            Guardar
                        </button>

                    </div>

                </form>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
