<!DOCTYPE html>
<!-- Panel Admin - editarCategoria.html -->
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">

            <div class="card shadow p-4 border-0 rounded-4">

                <h3 class="mb-4 fw-bold text-center"
                    th:text="${categoria.id != null} ? 'Editar Categoría' : 'Nueva Categoría'">
                </h3>

                <form th:action="@{/admin/categorias/guardar}"
                      th:object="${categoria}"
                      method="post">

                    <input type="hidden" th:field="*{id}">

                    <!-- NOMBRE -->
                    <div class="mb-3">

                        <label class="form-label">Nombre</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{nombre}"
                               required
                               minlength="3"
                               maxlength="60"
                               placeholder="Ej: Cortes, Maquillaje, Cremas">

                    </div>

                    <!-- TIPO -->
                    <div class="mb-3">

                        <label class="form-label">Tipo de Categoría</label>

                        <select class="form-select"
                                th:field="*{tipo}"
                                required>

                            <option value="" disabled selected>Seleccione una opción</option>
                            <option value="PRODUCTO">Producto</option>
                            <option value="SERVICIO">Servicio</option>

                        </select>

                    </div>

                    <div class="d-flex justify-content-between">

                        <a th:href="@{/admin/categorias}"
                           class="btn btn-outline-dark">
                            Volver
                        </a>

                        <button type="submit"
                                class="btn"
                                style="border:2px solid #b76e79; color:#b76e79;">
                            Guardar
                        </button>

                    </div>

                </form>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
