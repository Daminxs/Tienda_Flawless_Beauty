<!DOCTYPE html>
<!--
    Encargado para Damian: editarPromocion.html
-->
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">

                    <div class="card shadow p-4">

                        <h3 class="text-center mb-4">
                            <span th:if="${promocion.id == null}">Nueva Promoción</span>
                            <span th:if="${promocion.id != null}">Editar Promoción</span>
                        </h3>

                        <form th:action="@{/admin/guardarPromocion}"
                              th:object="${promocion}"
                              method="post"
                              enctype="multipart/form-data">

                            <input type="hidden" th:field="*{id}"/>

                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control"
                                       th:field="*{titulo}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control"
                                          th:field="*{descripcion}"></textarea>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Descuento (%)</label>
                                <input type="number" step="0.01"
                                       class="form-control"
                                       th:field="*{descuento}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Fecha Inicio</label>
                                <input type="date" class="form-control"
                                       th:field="*{fechaInicio}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Fecha Fin</label>
                                <input type="date" class="form-control"
                                       th:field="*{fechaFin}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Imagen</label>
                                <input type="file" class="form-control"
                                       name="imagenFile">
                            </div>

                            <div class="mb-3 text-center" th:if="${promocion.imagen != null}">
                                <p>Imagen actual:</p>
                                <img th:src="@{${promocion.imagen}}"
                                     style="max-width: 200px;">
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input"
                                       type="checkbox"
                                       th:field="*{activo}">
                                <label class="form-check-label">
                                    Activa
                                </label>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-outline-dark">
                                    Guardar
                                </button>

                                <a th:href="@{/admin/promociones}"
                                   class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                            </div>

                        </form>

                    </div>

                </div>
            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
