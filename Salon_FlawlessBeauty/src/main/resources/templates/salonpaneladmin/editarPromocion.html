<!DOCTYPE html>
<!--
    Encargado para Damian: editarPromocion.html
-->
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">

            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">

                    <div class="card shadow p-4">

                        <h3 class="text-center mb-4"
                            th:text="${promocion.id == null} ? 'Nueva Promoción' : 'Editar Promoción'">
                        </h3>

                        <!-- ERROR -->
                        <div th:if="${error}" class="alert alert-danger text-center">
                            <span th:text="${error}"></span>
                        </div>

                        <!-- FORM -->
                        <form th:action="@{/admin/guardarPromocion}"
                              th:object="${promocion}"
                              method="post"
                              enctype="multipart/form-data">

                            <input type="hidden" th:field="*{id}"/>

                            <!-- TITULO -->
                            <div class="mb-3">
                                <label class="form-label">Título</label>
                                <input type="text" class="form-control"
                                       th:field="*{titulo}" required>
                            </div>

                            <!-- DESCRIPCION -->
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea class="form-control"
                                          th:field="*{descripcion}"></textarea>
                            </div>

                            <!-- DESCUENTO -->
                            <div class="mb-3">
                                <label class="form-label">Descuento (%)</label>
                                <input type="number" step="0.01"
                                       class="form-control"
                                       th:field="*{descuento}" required>
                            </div>

                            <!-- TIPO -->
                            <div class="mb-3">
                                <label class="form-label">Tipo</label>
                                <select class="form-select"
                                        th:field="*{tipo}"
                                        onchange="this.form.action = '/admin/cambiarTipoPromocion'; this.form.submit();"
                                        required>
                                    <option value="">Seleccione</option>
                                    <option value="SERVICIO">Servicio</option>
                                    <option value="PRODUCTO">Producto</option>
                                </select>
                            </div>

                            <!-- CATEGORIA -->
                            <div class="mb-3">
                                <label class="form-label">Categoría</label>

                                <select class="form-select" th:field="*{categoria}" required>

                                    <option value="">Seleccione</option>

                                    <option th:each="c : ${categorias}"
                                            th:if="${promocion.tipo == null 
                                            or (promocion.tipo == 'SERVICIO' and c.tipo == 'SERVICIO') 
                                            or (promocion.tipo == 'PRODUCTO' and c.tipo == 'PRODUCTO')}"
                                            th:value="${c.id}"
                                            th:text="${c.nombre}">
                                    </option>

                                </select>
                            </div>

                            <!-- SERVICIO -->
                            <div class="mb-3" th:if="${promocion.tipo == 'SERVICIO'}">
                                <label class="form-label">Servicio específico</label>

                                <select class="form-select" th:field="*{servicio}">
                                    <option value="">Seleccione</option>

                                    <option th:each="s : ${servicios}"
                                            th:value="${s.id}"
                                            th:text="${s.nombre}">
                                    </option>
                                </select>
                            </div>

                            <!-- PRODUCTO -->
                            <div class="mb-3" th:if="${promocion.tipo == 'PRODUCTO'}">
                                <label class="form-label">Producto específico</label>

                                <select class="form-select" th:field="*{producto}">
                                    <option value="">Seleccione</option>

                                    <option th:each="p : ${productos}"
                                            th:value="${p.id}"
                                            th:text="${p.nombre}">
                                    </option>
                                </select>
                            </div>

                            <!-- CANTIDAD SOLO PRODUCTO -->
                            <div class="mb-3" th:if="${promocion.tipo == 'PRODUCTO'}">
                                <label class="form-label">Cantidad mínima</label>
                                <input type="number" class="form-control"
                                       th:field="*{cantidadMinima}">
                            </div>

                            <!-- FECHAS -->
                            <div class="mb-3">
                                <label class="form-label">Fecha Inicio</label>
                                <input type="date" class="form-control"
                                       th:field="*{fechaInicio}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Fecha Fin</label>
                                <input type="date" class="form-control"
                                       th:field="*{fechaFin}">
                            </div>

                            <!-- IMAGEN -->
                            <div class="mb-3">
                                <label class="form-label">Imagen</label>
                                <input type="file" class="form-control"
                                       name="imagenFile">
                            </div>

                            <div class="mb-3 text-center"
                                 th:if="${promocion.imagen != null}">
                                <p>Imagen actual:</p>
                                <img th:src="@{${promocion.imagen}}"
                                     style="max-width: 200px;">
                            </div>

                            <!-- ACTIVO -->
                            <div class="form-check mb-3">
                                <input class="form-check-input"
                                       type="checkbox"
                                       th:field="*{activo}">
                                <label class="form-check-label">
                                    Activa
                                </label>
                            </div>

                            <!-- BOTONES -->
                            <div class="d-grid gap-2">

                                <button type="submit" class="btn btn-dark">
                                    Guardar
                                </button>

                                <a th:href="@{/admin/promociones}"
                                   class="btn btn-outline-secondary">
                                    Cancelar
                                </a>

                            </div>

                        </form>

                    </div>

                </div>
            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
