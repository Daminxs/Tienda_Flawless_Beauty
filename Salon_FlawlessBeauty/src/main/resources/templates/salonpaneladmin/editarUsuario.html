<!DOCTYPE html>
<!--
    Panel Admin - Editar Usuario
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <head th:replace="general/fragmentos :: head"></head>

    <body>

        <header th:replace="general/fragmentos :: header"></header>

        <main class="container mt-5">

            <h2 class="text-center mb-4">Editar Usuario</h2>

            <div class="row justify-content-center">
                <div class="col-md-6">

                    <div class="card shadow p-4">

                        <form th:action="@{/admin/guardarUsuario}" method="post">

                            <!-- ID oculto -->
                            <input type="hidden" th:field="*{idUsuario}" th:value="${usuario.idUsuario}"/>

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{nombre}"
                                       th:value="${usuario.nombre}"
                                       required>
                            </div>

                            <!-- Correo -->
                            <div class="mb-3">
                                <label class="form-label">Correo</label>
                                <input type="email"
                                       class="form-control"
                                       th:field="*{correo}"
                                       th:value="${usuario.correo}"
                                       required>
                            </div>

                            <!-- Teléfono -->
                            <div class="mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text"
                                       class="form-control"
                                       th:field="*{telefono}"
                                       th:value="${usuario.telefono}">
                            </div>

                            <!-- Estado -->
                            <div class="mb-3">
                                <label class="form-label">Estado</label>
                                <select class="form-select" name="activo">
                                    <option th:value="true"
                                            th:selected="${usuario.activo}">
                                        Activo
                                    </option>
                                    <option th:value="false"
                                            th:selected="${!usuario.activo}">
                                        Inactivo
                                    </option>
                                </select>
                            </div>

                            <!-- ROLES -->
                            <div class="mb-3">
                                <label class="form-label">Roles</label>

                                <div th:each="rol : ${roles}" class="form-check">

                                    <input class="form-check-input"
                                           type="checkbox"
                                           name="roles"
                                           th:value="${rol.idRol}"
                                           th:checked="${usuario.roles.contains(rol)}">

                                    <label class="form-check-label"
                                           th:text="${rol.nombre}">
                                    </label>

                                </div>
                            </div>

                            <!-- BOTONES -->
                            <div class="d-flex justify-content-between mt-4">

                                <a th:href="@{/admin/usuarios}"
                                   class="btn btn-outline-dark">
                                    Volver
                                </a>

                                <button type="submit"
                                        class="btn"
                                        style="border:2px solid #b76e79; color:#b76e79;">
                                    Guardar Cambios
                                </button>

                            </div>

                        </form>

                    </div>

                </div>
            </div>

        </main>

        <footer th:replace="general/fragmentos :: footer"></footer>

    </body>
</html>
