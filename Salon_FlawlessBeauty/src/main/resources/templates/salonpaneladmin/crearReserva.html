<!DOCTYPE html>
<!--
    Encargado para Damian: crearReserva.html
-->
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">

            <h2 class="text-center mb-4">Crear Reserva</h2>

            <div class="card shadow p-4">

                <form th:action="@{/admin/reservas/guardar}" method="post">

                    <!-- CANTIDAD -->
                    <div class="mb-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" name="cantidad" class="form-control" min="1" required>
                    </div>

                    <!-- USUARIO -->
                    <div class="mb-3">
                        <label class="form-label">Usuario ID</label>
                        <input type="number" name="usuario.idUsuario" class="form-control" required>
                    </div>

                    <!-- PRODUCTO -->
                    <div class="mb-3">
                        <label class="form-label">Producto ID</label>
                        <input type="number" name="producto.id" class="form-control" required>
                    </div>

                    <button class="btn"
                            style="border:2px solid #b76e79; color:#b76e79;">
                        Guardar Reserva
                    </button>

                </form>

            </div>

            <div class="text-center mt-4">
                <a th:href="@{/admin}" class="btn btn-outline-dark">
                    Volver al panel
                </a>
            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
