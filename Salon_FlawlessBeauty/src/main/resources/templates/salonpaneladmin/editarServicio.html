<!DOCTYPE html>
<!-- Panel Admin - editarServicio.html -->
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{general/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{general/fragmentos :: header}"></header>

        <main class="container mt-5">

            <div class="card shadow p-4">

                <h3 class="mb-4"
                    th:text="${servicio.id != null} ? 'Editar Servicio' : 'Nuevo Servicio'">
                </h3>

                <form th:action="@{/admin/guardarServicio}"
                      th:object="${servicio}"
                      method="post">

                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label>Nombre</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{nombre}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Descripción</label>
                        <textarea class="form-control"
                                  th:field="*{descripcion}"></textarea>
                    </div>

                    <div class="mb-3">
                        <label>Precio</label>
                        <input type="number"
                               step="0.01"
                               class="form-control"
                               th:field="*{precio}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Categoría</label>

                        <select class="form-select" th:field="*{categoria}">

                            <option value="">Seleccione</option>

                            <option th:each="c : ${categorias}"
                                    th:value="${c.id}"
                                    th:text="${c.nombre}">
                            </option>

                        </select>

                    </div>

                    <div class="d-flex justify-content-between">

                        <a th:href="@{/admin/servicios}"
                           class="btn btn-outline-dark">
                            Volver
                        </a>

                        <button class="btn"
                                style="border:2px solid #b76e79; color:#b76e79;">
                            Guardar
                        </button>

                    </div>

                </form>

            </div>

        </main>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
