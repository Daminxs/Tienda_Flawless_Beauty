<!DOCTYPE html>
<!-- Encargado para Jose: listado.html (salonproductos) -->
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="general/fragmentos :: head"></head>

    <body>

        <header th:replace="general/fragmentos :: header"></header>

        <div class="container-fluid mt-4">

            <div class="row">

                <!-- CATEGORÍAS -->
                <div class="col-md-3">

                    <h4 class="mb-3">Categorías</h4>

                    <div class="list-group">

                        <a th:href="@{/salonproductos}"
                           class="list-group-item list-group-item-action">
                            Todos
                        </a>

                        <a th:each="c : ${categorias}"
                           th:href="@{/salonproductos(categoria=${c.id})}"
                           class="list-group-item list-group-item-action"
                           th:text="${c.nombre}">
                        </a>

                    </div>

                </div>

                <!-- PRODUCTOS -->
                <div class="col-md-9">
                    
                    <h2 class="mb-4">Productos del Salón</h2>

                    <div class="row">

                        <div class="col-md-4 mb-4"
                             th:each="producto : ${productos}">

                            <div class="card h-100 shadow-sm overflow-hidden">

                                <div style="
                                     width: 100%;
                                     height: 200px;
                                     overflow: hidden;
                                     display: flex;
                                     align-items: center;
                                     justify-content: center;
                                     background: #f5f5f5;
                                     ">

                                    <img th:if="${producto.imagen != null}"
                                         th:src="${producto.imagen}"
                                         style="
                                         width: 100%;
                                         height: 100%;
                                         object-fit: cover;
                                         display: block;
                                         ">

                                    <img th:if="${producto.imagen == null}"
                                         th:src="@{/img/productos/default.jpg}"
                                         style="
                                         width: 100%;
                                         height: 100%;
                                         object-fit: cover;
                                         display: block;
                                         ">

                                </div>

                                <div class="card-body">

                                    <h5 class="card-title fw-bold"
                                        th:text="${producto.nombre}">
                                    </h5>

                                    <p class="card-text text-muted"
                                       th:text="${producto.descripcion}">
                                    </p>

                                    <p class="fw-bold">
                                        ₡ <span th:text="${producto.precio}"></span>
                                    </p>

                                    <a th:href="@{/reservarProducto(id=${producto.id})}"
                                       class="btn w-100"
                                       style="background-color:#b76e79; color:white; border:none;">
                                        Reservar
                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <footer th:replace="general/fragmentos :: footer"></footer>

    </body>
</html>
