<!DOCTYPE html>
<!--
    Encargado para Damian: agendarCita.html
-->
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="general/fragmentos :: head"></head>

    <body>

        <header th:replace="general/fragmentos :: header"></header>

        <div class="container mt-5">

            <h3>
                Servicio: <span th:text="${servicio.nombre}"></span>
            </h3>

            <p>
                Precio: ₡<span th:text="${servicio.precio}"></span>
            </p>

            <hr>

            <p>
                <strong>Nombre:</strong>
                <span th:text="${usuario.nombre}"></span>
            </p>

            <p>
                <strong>Teléfono:</strong>
                <span th:text="${usuario.telefono}"></span>
            </p>

            <form th:action="@{/guardarCita}" method="post">

                <input type="hidden" name="servicioId" th:value="${servicio.id}">

                <label class="form-label">Fecha</label>
                <input type="date" name="fecha" class="form-control" required>

                <label class="mt-3 form-label">Hora disponible</label>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="hora" value="10:00">
                    <label class="form-check-label">10:00</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="hora" value="11:00">
                    <label class="form-check-label">11:00</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="hora" value="12:00">
                    <label class="form-check-label">12:00</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="hora" value="14:00">
                    <label class="form-check-label">14:00</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" name="hora" value="15:00">
                    <label class="form-check-label">15:00</label>
                </div>

                <br>

                <button class="btn btn-success">
                    Agendar Cita
                </button>

                <a th:href="@{/salonservicios}" class="btn btn-secondary">
                    Regresar
                </a>

            </form>

        </div>

        <footer th:replace="general/fragmentos :: footer"></footer>

    </body>
</html>
